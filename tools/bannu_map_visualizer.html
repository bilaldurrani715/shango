    #category-filter { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; background: #1e293b; border-bottom: 1px solid #334155; }
    .cat-btn { padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 12px; background: #334155; color: #cbd5e1; border: none; cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: #fbbf24; color: #000; }
    #list-container { flex: 1; overflow-y: auto; padding: 10px; }
    .place-item { padding: 12px; margin-bottom: 8px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; cursor: pointer; transition: all 0.2s; }
    .place-item:hover { border-color: #fbbf24; transform: translateY(-1px); }
    .place-item.active { border-color: #fbbf24; background: #1e293b; box-shadow: 0 0 10px rgba(251,191,36,0.2); }
    .place-title { font-weight: 700; font-size: 14px; color: #f8fafc; }
    .place-sub { font-size: 11.5px; color: #94a3b8; margin-top: 3px; }
    .place-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 11px; }
    .badge { padding: 2px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; font-size: 9.5px; }
    .coords-badge { color: #38bdf8; font-family: monospace; }
    .badge-hospital { background: #ef4444; color: white; }
    .badge-transport { background: #3b82f6; color: white; }
    .badge-gate { background: #f59e0b; color: black; }

    .badge-cantt { background: #6366f1; color: white; }
    .badge-park { background: #22c55e; color: black; }
    #map { flex: 1; height: 100%; position: relative; }
    .leaflet-popup-content-wrapper { background: #1e293b; color: #f8fafc; border-radius: 12px; border: 1px solid #475569; }
    .leaflet-popup-content h3 { font-size: 15px; color: #fbbf24; margin-bottom: 4px; }
    .leaflet-popup-content p { font-size: 12px; color: #cbd5e1; margin-bottom: 8px; }

    function getBadgeClass(cat) {
      return 'badge-' + (cat || 'general');
    }

    function renderPlaces(places) {
      const list = document.getElementById('list-container');
      list.innerHTML = '';
      places.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = 'place-item';
        item.id = 'place-' + idx;
        item.innerHTML = `
          <div class="place-title">${p.name}</div>
          <div class="place-sub">${p.subtitle || ''}</div>
          <div class="place-meta">
            <span class="badge ${getBadgeClass(p.category)}">${p.category || 'landmark'}</span>
            <span class="coords-badge">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span>
          </div>
        `;
        item.onclick = () => focusPlace(p, idx);
        list.appendChild(item);
      });
    }

    function plotMarkers(places) {
      markers.forEach(m => map.removeLayer(m));
      markers = [];

      places.forEach((p, idx) => {
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 7,
          fillColor: '#fbbf24',
          color: '#000',
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.85
        }).addTo(map);

        const gUrl = `https://www.google.com/maps?q=${p.lat},${p.lng}`;
        marker.bindPopup(`
          <h3>${p.name}</h3>
          <p>${p.subtitle || ''}</p>
          <p><strong>Category:</strong> ${p.category || 'General'}</p>
          <p><strong>GPS Coordinates:</strong> <code>${p.lat}, ${p.lng}</code></p>
          <div class="popup-links">
            <a href="${gUrl}" target="_blank" class="popup-link google">🌐 Open in Google Maps</a>
          </div>
        `);

        marker.on('click', () => {
          highlightListItem(idx);
        });

        markers.push(marker);
      });
    }

    function focusPlace(p, idx) {
      map.flyTo([p.lat, p.lng], 16, { animate: true, duration: 1 });
      if (markers[idx]) {
        markers[idx].openPopup();
      }
      highlightListItem(idx);
    }

    function highlightListItem(idx) {
      document.querySelectorAll('.place-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById('place-' + idx);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function filterCat(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      applyFilters();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      applyFilters();
    });

    function applyFilters() {
      const q = document.getElementById('search-input').value.trim().toLowerCase();
      const filtered = allPlaces.filter(p => {
        const matchesCat = (currentCategory === 'all') || (p.category === currentCategory);
        const matchesQuery = !q || p.name.toLowerCase().includes(q) ||
          (p.subtitle && p.subtitle.toLowerCase().includes(q)) ||
          (p.keywords && p.keywords.some(k => k.toLowerCase().includes(q)));
        return matchesCat && matchesQuery;
      });
      renderPlaces(filtered);
      plotMarkers(filtered);
    }
  </script>
