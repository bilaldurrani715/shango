name: shango
description: ShanGo ride-booking app (UI only, dummy data).
publish_to: 'none'
version: 1.0.3+4
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  firebase_analytics: ^11.4.4
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1
  google_sign_in: ^6.2.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  http: ^1.3.0
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.18.1
  package_info_plus: ^10.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/data/
    - assets/sounds/
