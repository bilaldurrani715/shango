  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #0f172a; color: #f8fafc; }
    
    /* Left Sidebar */
    #sidebar { width: 440px; height: 100%; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; z-index: 1000; box-shadow: 4px 0 24px rgba(0,0,0,0.4); }
    #header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    #header h1 { font-size: 17px; font-weight: 800; color: #fbbf24; display: flex; align-items: center; gap: 8px; }
    .count-badge { background: #3b82f6; color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    
    /* Action & Paste Bar */
    .paste-section { padding: 12px 16px; background: #0f172a; border-bottom: 1px solid #334155; }
    .paste-title { font-size: 11.5px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .paste-row { display: flex; gap: 8px; }
    .paste-input { flex: 1; padding: 8px 12px; background: #1e293b; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 12.5px; outline: none; }
    .paste-input:focus { border-color: #fbbf24; }
    .btn { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: #fbbf24; color: #000; }
    .btn-primary:hover { background: #f59e0b; }
    .btn-blue { background: #3b82f6; color: #fff; }
    .btn-blue:hover { background: #2563eb; }
    .btn-green { background: #10b981; color: #fff; }
    .btn-green:hover { background: #059669; }
    .btn-danger { background: #ef4444; color: #fff; padding: 4px 8px; font-size: 11px; }

    /* Edit Form */
    #edit-form { padding: 14px 16px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-label { font-size: 11px; font-weight: 700; color: #cbd5e1; }
    .form-input { padding: 8px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; font-size: 13px; outline: none; }
    .form-input:focus { border-color: #fbbf24; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }

    /* Places List */
    #list-header { padding: 10px 16px; background: #0f172a; font-size: 12px; font-weight: 700; color: #94a3b8; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    #places-list { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }
    .place-card { padding: 10px 12px; background: #0f172a; border-radius: 8px; border: 1px solid #334155; cursor: pointer; transition: all 0.2s; position: relative; }
    .place-card:hover { border-color: #fbbf24; }
    .place-card.active { border-color: #fbbf24; background: #1e293b; box-shadow: 0 0 10px rgba(251,191,36,0.2); }
    .card-title { font-weight: 700; font-size: 13.5px; color: #f8fafc; }
    .card-sub { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 9.5px; font-weight: 700; text-transform: uppercase; }
    .coords-text { font-family: monospace; font-size: 11px; color: #38bdf8; }

    /* Bottom Export Bar */
    #export-bar { padding: 12px 16px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 8px; }
    #export-bar .btn { flex: 1; }

    /* Map */
    #map { flex: 1; height: 100%; position: relative; }
    .map-helper { position: absolute; top: 12px; left: 60px; z-index: 999; background: rgba(15, 23, 42, 0.9); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; color: #fbbf24; border: 1px solid #334155; pointer-events: none; }

</head>
<body>

  <div id="sidebar">

        <button class="btn btn-blue" onclick="processPastedCoordinates()">Parse</button>
      </div>
    </div>

    <!-- Place Editor / Adder Form -->
    <div id="edit-form">
      <div class="form-group">
        <label class="form-label">Landmark / Place Name *</label>
        <input type="text" id="input-name" class="form-input" placeholder="e.g. DHQ Hospital Bannu" />
      </div>

      <div class="form-group">
        <label class="form-label">Subtitle / Street Area</label>
        <input type="text" id="input-subtitle" class="form-input" placeholder="e.g. DI Khan Road, Bannu" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Latitude *</label>
          <input type="number" step="any" id="input-lat" class="form-input" placeholder="32.954611" />
        </div>
        <div class="form-group">
          <label class="form-label">Longitude *</label>
          <input type="number" step="any" id="input-lng" class="form-input" placeholder="70.648167" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="input-category" class="form-input">
            <option value="hospital">Hospital / Clinic</option>
            <option value="transport">Bus Adda / Stand</option>
            <option value="gate">City Gate / Entry</option>
            <option value="education">College / University</option>
            <option value="bazaar">Bazaar / Market</option>
            <option value="residential">Township / Colony</option>
            <option value="chowk">Chowk / Intersection</option>
            <option value="government">Government / Police</option>
            <option value="park">Park / Recreation</option>
            <option value="suburb">Village / Suburb</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Keywords / Aliases (Comma separated)</label>
          <input type="text" id="input-keywords" class="form-input" placeholder="dhq, hospital, ڈی ایچ کیو" />
        </div>
      </div>

      <div class="form-row" style="margin-top: 4px;">
        <button class="btn btn-primary" style="flex: 2;" onclick="saveCurrentPlace()">💾 Save / Add Place</button>
        <button class="btn btn-blue" style="flex: 1;" onclick="clearForm()">Clear</button>
      </div>
    </div>

    <!-- Places List Header -->
    <div id="list-header">
      <span>Saved Verified Places</span>
      <span style="font-size: 11px; color: #38bdf8;">Click place to view on map</span>
    </div>

    <!-- Places List -->
    <div id="places-list"></div>

    <!-- Export & Download Bar -->
    <div id="export-bar">
      <button class="btn btn-green" onclick="copyJSON()">📋 Copy JSON</button>
      <button class="btn btn-primary" onclick="downloadJSON()">💾 Save bannu_places.json</button>
    </div>

  <div id="map">
    <div class="map-helper">🖱️ Click anywhere on map to drop / move pin to that exact spot</div>

    // Map click listener -> drop active draggable pin
    map.on('click', (e) => {
      setPin(e.latlng.lat, e.latlng.lng, true);
    });

    function setPin(lat, lng, panTo = false) {
      document.getElementById('input-lat').value = lat.toFixed(6);
      document.getElementById('input-lng').value = lng.toFixed(6);

      if (activeMarker) {
        activeMarker.setLatLng([lat, lng]);
      } else {
        activeMarker = L.marker([lat, lng], { draggable: true }).addTo(map);
        activeMarker.on('dragend', (ev) => {
          const pos = ev.target.getLatLng();
          document.getElementById('input-lat').value = pos.lat.toFixed(6);
          document.getElementById('input-lng').value = pos.lng.toFixed(6);
        });
      }

      if (panTo) {
        map.panTo([lat, lng]);
      }
    }

    function renderPlacesList() {
      const container = document.getElementById('places-list');
      container.innerHTML = '';
      document.getElementById('count-badge').innerText = `${places.length} Places`;

      places.forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'place-card' + (editingIndex === idx ? ' active' : '');
        card.id = 'place-card-' + idx;
        card.innerHTML = `
          <div class="card-title">${p.name}</div>
          <div class="card-sub">${p.subtitle || ''}</div>
          <div class="card-footer">
            <span class="badge" style="background: #334155; color: #fbbf24;">${p.category || 'landmark'}</span>
            <span class="coords-text">${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}</span>
            <button class="btn btn-danger" onclick="event.stopPropagation(); deletePlace(${idx})">🗑️</button>
          </div>
        `;
        card.onclick = () => selectPlaceForEdit(idx);
        container.appendChild(card);
      });
    }

    function renderMapMarkers() {
      placeMarkers.forEach(m => map.removeLayer(m));
      placeMarkers = [];

      places.forEach((p, idx) => {
        const marker = L.circleMarker([p.lat, p.lng], {
          radius: 8,
          fillColor: '#fbbf24',
          color: '#000',
          weight: 1.5,
          opacity: 1,
          fillOpacity: 0.9
        }).addTo(map);

        marker.bindPopup(`<strong>${p.name}</strong><br>${p.subtitle || ''}<br><code>${p.lat}, ${p.lng}</code>`);
        marker.on('click', () => selectPlaceForEdit(idx));
        placeMarkers.push(marker);
      });
    }

    function selectPlaceForEdit(idx) {
      editingIndex = idx;
      const p = places[idx];
      document.getElementById('input-name').value = p.name;
      document.getElementById('input-subtitle').value = p.subtitle || '';
      document.getElementById('input-lat').value = p.lat;
      document.getElementById('input-lng').value = p.lng;
      document.getElementById('input-category').value = p.category || 'hospital';
      document.getElementById('input-keywords').value = (p.keywords || []).join(', ');

      setPin(p.lat, p.lng, true);
      renderPlacesList();
    }

    function saveCurrentPlace() {
      const name = document.getElementById('input-name').value.trim();
      const subtitle = document.getElementById('input-subtitle').value.trim();
      const lat = parseFloat(document.getElementById('input-lat').value);
      const lng = parseFloat(document.getElementById('input-lng').value);
      const category = document.getElementById('input-category').value;
      const rawKeywords = document.getElementById('input-keywords').value.trim();

      if (!name) {
        alert('Please enter a Place Name!');
        return;
      }
      if (isNaN(lat) || isNaN(lng)) {
        alert('Please click on the map or enter Latitude and Longitude!');
        return;
      }

      const keywords = rawKeywords
        ? rawKeywords.split(',').map(k => k.trim()).filter(k => k.length > 0)
        : [name.toLowerCase()];

      const placeObj = { name, subtitle, lat, lng, category, keywords };

      if (editingIndex >= 0 && editingIndex < places.length) {
        places[editingIndex] = placeObj;
      } else {
        places.unshift(placeObj);
      }

      renderPlacesList();
      renderMapMarkers();
      clearForm();
      alert(`Saved: ${name}`);
    }

    function deletePlace(idx) {
      if (confirm(`Are you sure you want to delete "${places[idx].name}"?`)) {
        places.splice(idx, 1);
        if (editingIndex === idx) clearForm();
        renderPlacesList();
        renderMapMarkers();
      }
    }

    function clearForm() {
      editingIndex = -1;
      document.getElementById('input-name').value = '';
      document.getElementById('input-subtitle').value = '';
      document.getElementById('input-lat').value = '';
      document.getElementById('input-lng').value = '';
      document.getElementById('input-keywords').value = '';
      if (activeMarker) {
        map.removeLayer(activeMarker);
        activeMarker = null;
      }
      renderPlacesList();
    }

    // Convert DMS (e.g. 32°57'16.6"N 70°38'53.4"E) or Google Maps URL to Decimal
    function processPastedCoordinates() {
      const text = document.getElementById('paste-box').value.trim();
      if (!text) return;

      // 1. Check for DMS: 32°57'16.6"N 70°38'53.4"E
      const dmsRegex = /(\d+)[°\s]+(\d+)['\s]+([\d.]+)"?\s*([NS])\s*,?\s*(\d+)[°\s]+(\d+)['\s]+([\d.]+)"?\s*([EW])/i;
      const dmsMatch = text.match(dmsRegex);
      if (dmsMatch) {
        let lat = parseInt(dmsMatch[1]) + parseInt(dmsMatch[2])/60 + parseFloat(dmsMatch[3])/3600;
        if (dmsMatch[4].toUpperCase() === 'S') lat = -lat;
        let lng = parseInt(dmsMatch[5]) + parseInt(dmsMatch[6])/60 + parseFloat(dmsMatch[7])/3600;
        if (dmsMatch[8].toUpperCase() === 'W') lng = -lng;
        setPin(lat, lng, true);
        alert(`Parsed DMS: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
        return;
      }

      // 2. Check for Decimal coordinates: 32.954611, 70.648167
      const decRegex = /(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/;
      const decMatch = text.match(decRegex);
      if (decMatch) {
        const lat = parseFloat(decMatch[1]);
        const lng = parseFloat(decMatch[2]);
        setPin(lat, lng, true);
        alert(`Parsed Decimal: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
        return;
      }

      // 3. Check for Google Maps URL with @lat,lng
      const urlRegex = /@(-?\d+\.\d+),(-?\d+\.\d+)/;
      const urlMatch = text.match(urlRegex);
      if (urlMatch) {
        const lat = parseFloat(urlMatch[1]);
        const lng = parseFloat(urlMatch[2]);
        setPin(lat, lng, true);
        alert(`Extracted from Maps URL: ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
        return;
      }

      alert('Could not parse coordinates. Please paste standard coordinates or a Google Maps link.');
    }

    function copyJSON() {
      const jsonStr = JSON.stringify(places, null, 2);
      navigator.clipboard.writeText(jsonStr).then(() => {
        alert('Copied entire Bannu places JSON to clipboard! You can paste it into assets/data/bannu_places.json.');
      });
    }

    function downloadJSON() {
      const jsonStr = JSON.stringify(places, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'bannu_places.json';
      a.click();
    }
